name: Weekly Summary

# Prints a summary of the last 7 days' bot activity (questions forecast, $
# spent, AskNews usage, alerts) to this workflow's job log, read from the
# persisted forecast DB on the `data` branch. No spend either way, but two
# exceptions to "no API calls": the performance report section
# (scripts/performance_report.py) makes read-only GETs against the
# Metaculus API for resolved questions' official scores (METACULUS_TOKEN),
# and the backup-poller health section (scripts/dispatch_health.py) reads
# this repo's own Actions run history via the built-in GITHUB_TOKEN --
# hence `actions: read` below. See docs/STAGE_B_PLAN.md "Backup poller".
#
# One write side effect: the performance report section also logs each
# newly-resolved binary question's raw ensemble probability + outcome to
# the local `resolutions` table (pure tracking for a future calibration
# check -- see docs/STAGE_B_PLAN.md "Calibration tracking"), so this
# workflow persists the DB back to the `data` branch afterward -- hence
# `contents: write` below, previously just `read`. Shares the same
# concurrency group as the two forecast workflows (not the default ${{
# github.workflow }}) so that persist can never race theirs on the `data`
# branch -- whichever triggers second just queues instead of overlapping.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC

concurrency:
  group: metaculus-bot-forecast
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: bash scripts/install_dependencies_with_retry.sh
      - name: Restore forecast DB from data branch
        run: bash scripts/restore_data_branch.sh
      - name: Print weekly summary
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METACULUS_DISPATCH_PAT_EXPIRES: ${{ vars.METACULUS_DISPATCH_PAT_EXPIRES }}
        run: poetry run python scripts/weekly_summary.py --days 7
      - name: Persist forecast DB to data branch
        run: bash scripts/persist_data_branch.sh
