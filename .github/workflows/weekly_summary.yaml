name: Weekly Summary

# Prints a summary of the last 7 days' bot activity (questions forecast, $
# spent, AskNews usage, alerts) to this workflow's job log, read from the
# persisted forecast DB on the `data` branch. No spend either way, but one
# exception to "no API calls": the performance report section
# (scripts/performance_report.py) makes read-only GETs against the
# Metaculus API to pull official peer/baseline scores for any of our
# questions that have since resolved -- hence METACULUS_TOKEN below.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Restore forecast DB from data branch
        run: bash scripts/restore_data_branch.sh
      - name: Print weekly summary
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: poetry run python scripts/weekly_summary.py --days 7
