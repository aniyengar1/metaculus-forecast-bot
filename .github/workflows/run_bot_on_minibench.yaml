name: Forecast on MiniBench

# MiniBench only -- see run_bot_on_seasonal.yaml for the Fall seasonal
# tournament's separate hourly schedule. See docs/STAGE_B_PLAN.md for the
# per-provider quota math behind the daily question budget and why
# MiniBench gets priority on the quota the two share.
#
# Every 15 min, not every 2h: MiniBench questions are only open ~3h each
# (confirmed 2026-10-11 diagnosis), so a coarser poll risks missing some
# entirely.
#
# Concurrency group is explicitly shared with run_bot_on_seasonal.yaml (not
# the default ${{ github.workflow }}, which is per-workflow-name) so the two
# can never run at the same time and race on the data branch -- whichever
# triggers second queues instead of overlapping.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes

concurrency:
  group: metaculus-bot-forecast
  cancel-in-progress: false

# Needed to push the updated forecast DB to the `data` branch.
permissions:
  contents: write

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Restore forecast DB from data branch
        run: bash scripts/restore_data_branch.sh
      - name: Run bot (MiniBench only)
        run: poetry run python main.py --mode tournament --target minibench --publish
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional operational overrides -- set as repo Variables (not
          # Secrets) if you want to change these without a code change.
          # Empty/unset falls back to the code default in config.py.
          MAX_COST_PER_DAY: ${{ vars.MAX_COST_PER_DAY }}
          MAX_QUESTIONS_PER_DAY_CEILING: ${{ vars.MAX_QUESTIONS_PER_DAY_CEILING }}
      - name: Persist forecast DB to data branch
        if: always()
        run: bash scripts/persist_data_branch.sh
