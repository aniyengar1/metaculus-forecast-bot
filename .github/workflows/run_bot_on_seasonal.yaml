name: Forecast on Seasonal Tournament

# Fall 2026 seasonal tournament (fall-futureeval-2026) only -- see
# run_bot_on_minibench.yaml for MiniBench's schedule. Enabled 2026-10-12
# (ENABLE_SEASONAL_TOURNAMENT defaults True in metaculus_bot/config.py).
#
# Every 15 min, same as MiniBench -- corrected 2026-10-12 after pulling all
# 27 real fall-futureeval-2026 questions directly from the API: every single
# one (26 real + 1 resolved pre-season practice question) has an exactly
# 3-hour open window, same as MiniBench, not the "days/weeks" originally
# assumed. Release cadence is bursty (0-4 questions/day, one 4-day gap seen
# so far) but each individual question is just as short-lived, so hourly
# polling risked missing several entirely. See docs/STAGE_B_PLAN.md
# "Seasonal cadence correction" for the full breakdown.
#
# Offset by 7 min from MiniBench's :00/:15/:30/:45 triggers (this fires at
# :07/:22/:37/:52) so the two interleave on the shared concurrency group
# below instead of colliding on literally every trigger -- each still gets
# checked roughly every ~7-8 min in practice, just never at the exact same
# moment as the other.
#
# Concurrency group is explicitly shared with run_bot_on_minibench.yaml (not
# the default ${{ github.workflow }}, which is per-workflow-name) so the two
# can never run at the same time and race on the data branch.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: metaculus-bot-forecast
  cancel-in-progress: false

# Needed to push the updated forecast DB to the `data` branch.
permissions:
  contents: write

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    # See run_bot_on_minibench.yaml -- same reasoning, same shared
    # concurrency group and backup poller.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Restore forecast DB from data branch
        run: bash scripts/restore_data_branch.sh
      - name: Run bot (seasonal tournament only)
        run: poetry run python main.py --mode tournament --target seasonal --publish
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional operational overrides -- set as repo Variables (not
          # Secrets) if you want to change these without a code change.
          # Empty/unset falls back to the code default in config.py.
          MAX_COST_PER_DAY: ${{ vars.MAX_COST_PER_DAY }}
          MAX_QUESTIONS_PER_DAY_CEILING: ${{ vars.MAX_QUESTIONS_PER_DAY_CEILING }}
          ENABLE_SEASONAL_TOURNAMENT: ${{ vars.ENABLE_SEASONAL_TOURNAMENT }}
          MINIBENCH_QUOTA_RESERVE: ${{ vars.MINIBENCH_QUOTA_RESERVE }}
          REFORECAST_STALENESS_DAYS: ${{ vars.REFORECAST_STALENESS_DAYS }}
          MAX_REFORECASTS_PER_DAY: ${{ vars.MAX_REFORECASTS_PER_DAY }}
      - name: Persist forecast DB to data branch
        if: always()
        run: bash scripts/persist_data_branch.sh
